<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE DRIIP | Streetwear</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            padding: 20px 0;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 3px;
            border-bottom: 2px solid #222;
            margin-bottom: 25px;
        }
        .products-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .product-card {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 320px;
            border: 1px solid #333;
            box-sizing: border-box;
        }
        .product-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product-title {
            font-size: 18px;
            margin: 12px 0 6px;
            font-weight: bold;
        }
        .price {
            color: #2ecc71;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .btn-whatsapp {
            display: block;
            background-color: #25d366;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header">ELITE DRIIP</div>
