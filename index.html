<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streetwear Store</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header {
            padding: 20px 0;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
        }
        .product-card {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            max-width: 350px;
            border: 1px solid #333;
        }
        .product-card img {
            width: 100%;
            border-radius: 8px;
        }
        .product-title {
            font-size: 18px;
            margin: 15px 0 5px;
        }
        .price {
            color: #2ecc71;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn-whatsapp {
            display: inline-block;
            background-color: #25d366;
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">YOUR BRAND NAME</div>

    <div class="product-card">
        <!-- بدل رابط الصورة برابط صورتك -->
        <img src="https://via.placeholder.com/300" alt="Skull Cap">
        <div class="product-title">Black Skull Cap</div>
        <div class="price">150 DH</div>
        <!-- بدل رقم الهاتف برقمك -->
        <a href="https://wa.me/212600000000?text=Salam%20بغيت%20نطلب%20Black%20Skull%20Cap" class="btn-whatsapp">اطلب الآن عبر الواتساب</a>
    </div>

</body>
</html>
